<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devon Linssen – Product Category Manager</title>
<style>
:root{
  --bg:#eef1f4; --panel:#ffffff; --navy:#12375c; --navy-ink:#ffffff; --teal:#0f6b7a;
  --text:#1c2b3a; --muted:#d0d8e0; --rule:#12375c;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1823; --panel:#16273a; --navy:#6fa8dc; --navy-ink:#0e1823; --teal:#5fc4d4;
    --text:#e4ebf2; --muted:#2a3d52; --rule:#6fa8dc; color-scheme: dark;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Roboto Condensed","Arial Narrow",Arial,sans-serif;line-height:1.5;font-size:17px}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 48px;display:grid;grid-template-columns:300px 1fr;gap:24px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:6px solid var(--navy);padding:24px}
.photo{display:block;width:100%;max-width:220px;aspect-ratio:1/1;object-fit:cover;object-position:50% 30%;margin:0 0 16px;border:0}
h1{margin:0 0 12px;font-size:40px;line-height:1.05;color:var(--navy);font-weight:700}
.card hr{border:0;border-top:4px solid var(--rule);margin:16px 0}
.note{color:var(--teal);font-weight:700;font-size:19px;line-height:1.35}
.note p{margin:0 0 14px}
main{min-width:0}
.layout{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:8px}
.tab{width:100%;text-align:left;font:inherit;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;padding:12px 16px;border:2px solid var(--navy);background:var(--panel);color:var(--navy);cursor:pointer;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%);padding-right:30px}
.tab[aria-current="true"]{background:var(--navy);color:var(--navy-ink)}
.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.panel{background:var(--panel);padding:8px 24px 24px;margin-bottom:16px;border-left:8px solid var(--muted);box-shadow:0 0 0 0 transparent;transition:border-color .25s,box-shadow .25s}
.panel.on{border-left-color:var(--navy);box-shadow:0 0 0 3px var(--navy)}
.panel.on .theme-title{color:var(--navy)}
.panel{scroll-margin:20px}
@media(min-width:761px) and (min-height:720px){aside.card{position:sticky;top:16px;align-self:start}}
@media(prefers-reduced-motion:reduce){.panel{transition:none}}
.panel[hidden]{display:none}
.item{padding:16px 0}
.item+.item{border-top:3px solid var(--muted)}
h2{margin:0 0 6px;font-size:19px;letter-spacing:.02em;text-transform:uppercase;color:var(--teal)}
.item p{margin:0;max-width:62ch}
.item p::before{content:"\25B8  ";color:var(--navy)}
.all{margin-top:16px;font:inherit;background:none;border:0;color:var(--teal);font-weight:700;cursor:pointer;text-decoration:underline;padding:4px 0}
.all:focus-visible{outline:3px solid var(--teal)}
.theme-title{font-size:32px;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);font-weight:700;padding-top:14px}
@media print{.tabs,.all{display:none}.panel[hidden]{display:block}}
</style>
</head>

});
function select(id,skipHash,scroll){
  if(!DATA.some(function(d){return d.id===id}))id=DATA[0].id;
  DATA.forEach(function(d){
    var on=d.id===id;
    var t=document.getElementById("t-"+d.id);
    if(on)t.setAttribute("aria-current","true");else t.removeAttribute("aria-current");
    document.getElementById("p-"+d.id).classList.toggle("on",on);
  });
  if(scroll){
    var calm=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.getElementById("p-"+id).scrollIntoView({behavior:calm?"auto":"smooth",block:"nearest"});
  }
  if(!skipHash){try{location.hash=id}catch(e){}}
}
function fromHash(){var h=(location.hash||"").slice(1);select(h,true,!!h)}
window.addEventListener("hashchange",fromHash);fromHash();
</script>
